# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - berufebot-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Where am I?
        run: |
          echo "PWD = $(pwd)"
          echo "Listing:"
          ls -la   

      
       #✔️ Kein ZIP mehr nötig! Azure baut selbst.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
            name: source
            path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
  
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: source
          path: .
  
      - name: Deploy Source to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'berufebot-api'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_77473977DF4D4350A73576EF3D03C52F }}





